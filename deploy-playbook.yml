---
- name: Deploy Selected Flask Service
  hosts: localhost
  connection: local

  vars:
    service_name: "{{ lookup('env', 'SERVICE') }}"

  tasks:
    - name: Pull Docker image
      command: "docker pull matanatttias/{{ service_name }}:1.0"

    - name: Remove existing service containers
      shell: |
        docker rm -f service1 service2 2>/dev/null || true

    - name: Run selected service
      command: "docker run -d --name {{ service_name }} -p 5000:5000 matanatttias/{{ service_name }}:1.0"